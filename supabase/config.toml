[functions.whatsapp-webhook]
verify_jwt = false

[functions.submit-signature]
verify_jwt = false

[functions.whatsapp-process-scheduled]
verify_jwt = false

[functions.whatsapp-queue-worker]
verify_jwt = false

[functions.whatsapp-status-worker]
verify_jwt = false

[functions.quote-reminders]
verify_jwt = false

# ai-agent tem dois caminhos de entrada e faz a própria autenticação em ambos, então o
# gateway não deve exigir JWT: (1) painel — valida o JWT do usuário manualmente via
# sb.auth.getUser e retorna 401 se inválido/ausente; (2) canal WhatsApp (Fase 4) — a
# chamada interna do whatsapp-webhook manda só x-internal-secret, sem Authorization, e é
# validada contra AI_INTERNAL_SECRET. Com verify_jwt=true o gateway barrava a chamada
# interna antes de chegar no código. Sem regressão no painel (a checagem manual continua).
[functions.ai-agent]
verify_jwt = false

# Cron interno (Fase 5): expira pendências vencidas (ai_operator_pending_actions).
# O pg_cron chama só com x-cron-secret (sem Authorization), então o gateway não pode
# exigir JWT. Ação idempotente e interna (só marca 'expired' o que passou de expires_at).
[functions.expire-pending-actions]
verify_jwt = false

# Rotinas proativas da Fase 5 (chamadas pelo pg_cron só com x-cron-secret, sem JWT).
# Cada uma valida o próprio CRON_SECRET internamente.
[functions.ai-daily-briefing]
verify_jwt = false

[functions.ai-whatsapp-followups]
verify_jwt = false

[functions.ai-business-monitor]
verify_jwt = false

# Emissão fiscal (NF-e/NFS-e via Contora).
# Receptor do webhook do provedor: chega SEM Authorization (só headers X-Fiscal-*),
# então o gateway não pode exigir JWT. A função valida a assinatura HMAC-SHA256
# (X-Fiscal-Signature sobre timestamp.rawBody) internamente antes de processar.
[functions.fiscal-webhook]
verify_jwt = false

# Reconciliação (rede de segurança para webhooks perdidos): pg_cron chama só com
# x-cron-secret (sem Authorization). Faz GET /status (grátis) dos documentos ainda
# não-terminais e atualiza o banco. Ação idempotente e interna.
[functions.fiscal-reconcile]
verify_jwt = false

# Motor da Agenda & Tarefas 2.0 (regras R1-R12, lembretes, recorrência): pg_cron
# chama só com x-cron-secret (sem Authorization). Idempotente por automation_key.
[functions.task-automations]
verify_jwt = false

# Detector da Caixa de Entrada (Fase 9): pg_cron chama só com x-cron-secret.
# Só LÊ conversas e grava sugestões — nunca cria tarefa nem envia mensagem.
[functions.agenda-inbox-detector]
verify_jwt = false

# Caixa de entrada financeira: gera propostas de lançamento e aplica as aprovadas.
# Painel manda JWT (e a identidade fica registrada na decisão); cron manda x-cron-secret.
[functions.finance-review]
verify_jwt = false

# Sincronização de extrato (Open Finance via Pluggy). Mesmo desenho da banking-reconcile:
# painel manda JWT, cron manda x-cron-secret — a validação é interna.
[functions.banking-sync]
verify_jwt = false

# Motor de conciliação bancária. Dois chamadores: o painel (manda o JWT do usuário,
# validado dentro da função via auth.getUser) e a varredura diária (pg_cron, que manda
# só x-cron-secret). Com verify_jwt=true o gateway barraria o cron antes do código.
[functions.banking-reconcile]
verify_jwt = false

# Integração bancária (Open Finance via Pluggy): receptor de webhooks do Pluggy.
# Chega SEM Authorization — a autenticação é o token secreto na query string
# (?token=), validado internamente contra PLUGGY_WEBHOOK_TOKEN (timing-safe).
# A pluggy-connect-token NÃO entra aqui: mantém verify_jwt=true (default),
# só usuário logado no ERP pode pedir Connect Token.
[functions.pluggy-webhook]
verify_jwt = false
